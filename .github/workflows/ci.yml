name: Eidetic Player CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  airplay-source-build:
    name: AirPlay pinned source build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install AirPlay build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool patch pkg-config \
            libpopt-dev libconfig-dev libasound2-dev libavahi-client-dev \
            libssl-dev libsoxr-dev libplist-dev libsodium-dev uuid-dev \
            libgcrypt20-dev libavutil-dev libavcodec-dev libavformat-dev \
            libpipewire-0.3-dev

      - name: Build and verify pinned AirPlay sources
        run: |
          artifact_root="$(mktemp -d)/airplay"
          deploy/linux/airplay/build-airplay-integration.sh --output "$artifact_root"
          test -x "$artifact_root/bin/shairport-sync"
          test -x "$artifact_root/bin/nqptp"
          test -s "$artifact_root/artifact.json"

  linux:
    name: Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- package-lock.json

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Report development dependency vulnerabilities
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify Linux executable modes
        run: npm run verify:linux:executables

      - name: Verify shell syntax
        run: |
          find deploy/linux -type f \( -name '*.sh' -o -path '*/runtime/*' \) -print0 |
            xargs -0 -n1 bash -n

      - name: Verify installer-safe deployment profile
        run: npm run verify:linux:installer

      - name: Build
        run: npm run build

      - name: Build Linux release artifact
        run: npm run build:linux

      - name: Verify Linux release artifact
        run: npm run verify:linux:release -- --root . --arch x64 --phase build

      - name: Run standard test suite
        run: npm test

      - name: Run POSIX tests
        run: npm run test:posix

      - name: Check case-sensitive imports
        run: npm run test:case-sensitive
